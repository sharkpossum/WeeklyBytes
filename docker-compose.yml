services:
  mongo:
    image: mongo:latest
    container_name: mongo-container
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./server
    container_name: express-server
    environment:
      - SERVER_PORT=5000
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/db?authSource=admin
    ports:
      - "5000:5000"
    depends_on:
      - mongo
  
  frontend:
    build: ./client
    container_name: next-js-client
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data: